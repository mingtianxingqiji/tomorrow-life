<html lang="zh-CN">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" href="assets/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部导航栏 -->
    <header class="app-header">
      <button class="menu-btn" id="menuBtn" aria-label="打开菜单">
        <span></span><span></span><span></span>
      </button>
      <h1 class="app-title" id="pageTitle">明天星期几</h1>
      <div class="header-right">
        <button class="today-btn" id="todayBtn" aria-label="今天">今</button>
      </div>
    </header>

    <!-- 侧边栏遮罩 -->
    <div class="overlay" id="overlay"></div>

    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="app-logo">
          <div class="logo-circle">
            <svg viewBox="0 0 48 48" width="40" height="40">
              <rect x="6" y="10" width="36" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
              <line x1="6" y1="20" x2="42" y2="20" stroke="currentColor" stroke-width="2.5"/>
              <line x1="16" y1="6" x2="16" y2="14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="32" y1="6" x2="32" y2="14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="24" cy="30" r="2.5" fill="currentColor"/>
            </svg>
          </div>
        </div>
        <div class="app-name">明天星期几</div>
        <div class="app-subtitle" id="sidebarDate">加载中...</div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-module="home">
          <svg viewBox="0 0 24 24" class="nav-icon"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>首页</span>
        </a>
        <a class="nav-item" data-module="plan">
          <svg viewBox="0 0 24 24" class="nav-icon"><path fill="currentColor" d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          <span>每日计划</span>
        </a>
        <a class="nav-item" data-module="outfit">
          <svg viewBox="0 0 24 24" class="nav-icon"><path fill="currentColor" d="M21 7l-1.5-3h-3l-2 2h-3l-2-2h-3L5 7v4l2 1v9h10v-9l2-1V7h2z"/></svg>
          <span>穿搭日记</span>
        </a>
        <a class="nav-item" data-module="meal">
          <svg viewBox="0 0 24 24" class="nav-icon"><path fill="currentColor" d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
          <span>三餐日记</span>
        </a>
        <a class="nav-item" data-module="drink">
          <svg viewBox="0 0 24 24" class="nav-icon"><path fill="currentColor" d="M3 2l2.21 18.5C5.4 21.37 6.11 22 7 22h10c.89 0 1.6-.63 1.79-1.5L21 2H3zm9 17c-3.31 0-6-2.69-6-6h2c0 2.21 1.79 4 4 4v2z"/></svg>
          <span>饮品日记</span>
        </a>
        <a class="nav-item" data-module="sport">
          <svg viewBox="0 0 24 24" class="nav-icon"><path fill="currentColor" d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 6.9 1.4z"/></svg>
          <span>运动日记</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="date-nav">
          <button class="date-arrow" id="prevDate">‹</button>
          <input type="date" id="dateSelector" class="date-selector">
          <button class="date-arrow" id="nextDate">›</button>
        </div>
        <div class="sidebar-stats">
          <div class="stat-item">
            <span class="stat-num" id="totalRecords">0</span>
            <span class="stat-label">总记录</span>
          </div>
          <div class="stat-item">
            <span class="stat-num" id="streakDays">0</span>
            <span class="stat-label">连续天数</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content" id="mainContent">
      <!-- 各模块内容由 JS 动态渲染 -->
    </main>

    <!-- 浮动添加按钮 -->
    <button class="fab" id="fab" style="display:none;">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
  </div>

  <!-- 模态弹窗容器 -->
  <div class="modal-container" id="modalContainer"></div>

  <!-- 图片预览容器 -->
  <div class="image-viewer" id="imageViewer">
    <button class="viewer-close" id="viewerClose">×</button>
    <img id="viewerImg" src="" alt="预览">
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/modules/home.js"></script>
  <script src="js/modules/plan.js"></script>
  <script src="js/modules/outfit.js"></script>
  <script src="js/modules/meal.js"></script>
  <script src="js/modules/drink.js"></script>
  <script src="js/modules/sport.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
