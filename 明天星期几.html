:root {
  --primary: #7C9885;
  --primary-light: #A8C0B0;
  --primary-dark: #5A7A66;
  --primary-bg: #F0F4F1;
  --accent: #E8A87C;
  --bg: #FAFAF8;
  --card-bg: #FFFFFF;
  --text: #2D3436;
  --text-secondary: #636E72;
  --text-hint: #B2BEC3;
  --border: #E8ECEA;
  --danger: #E17055;
  --warning: #FDCB6E;
  --success: #00B894;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --radius: 14px;
  --radius-sm: 8px;
  --header-h: 56px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ===== 重置 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  overscroll-behavior: none;
}
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; }
img { display: block; max-width: 100%; }

/* ===== App 容器 ===== */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  position: relative;
}

/* ===== 顶部导航栏 ===== */
.app-header {
  height: calc(var(--header-h) + var(--safe-top));
  padding-top: var(--safe-top);
  background: var(--card-bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: 12px;
  padding-right: 12px;
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 100;
  flex-shrink: 0;
}
.app-header { height: var(--header-h); padding-top: 0; }
@supports (padding-top: env(safe-area-inset-top)) {
  .app-header { height: calc(var(--header-h) + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); }
}

.menu-btn {
  width: 44px; height: 44px;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  gap: 5px;
  border-radius: 50%;
  transition: background 0.2s;
}
.menu-btn:active { background: var(--primary-bg); }
.menu-btn span {
  width: 20px; height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: transform 0.3s;
}

.app-title {
  font-size: 17px;
  font-weight: 600;
  flex: 1;
  text-align: center;
  letter-spacing: 0.5px;
}

.header-right { width: 44px; display: flex; justify-content: flex-end; }
.today-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}

/* ===== 侧边栏 ===== */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s, visibility 0.3s;
  z-index: 200;
}
.overlay.active { opacity: 1; visibility: visible; }

.sidebar {
  position: fixed;
  top: 0; left: 0;
  width: 280px;
  height: 100%;
  background: var(--card-bg);
  z-index: 201;
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  box-shadow: 2px 0 20px rgba(0,0,0,0.1);
}
.sidebar.open { transform: translateX(0); }

.sidebar-header {
  padding: 40px 24px 20px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
}
.app-logo { margin-bottom: 12px; }
.logo-circle {
  width: 56px; height: 56px;
  background: rgba(255,255,255,0.2);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.app-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.app-subtitle { font-size: 13px; opacity: 0.85; }

.sidebar-nav {
  flex: 1;
  padding: 16px 12px;
  overflow-y: auto;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 15px;
  font-weight: 500;
  transition: all 0.2s;
  margin-bottom: 4px;
  text-decoration: none;
}
.nav-item:active { background: var(--primary-bg); }
.nav-item.active {
  background: var(--primary-bg);
  color: var(--primary-dark);
  font-weight: 600;
}
.nav-icon { width: 22px; height: 22px; flex-shrink: 0; }

.sidebar-footer {
  padding: 16px 20px calc(20px + var(--safe-bottom));
  border-top: 1px solid var(--border);
}
.date-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
.date-arrow {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--primary-bg);
  color: var(--primary-dark);
  font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.date-selector {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  text-align: center;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
}
.sidebar-stats {
  display: flex;
  gap: 12px;
}
.stat-item {
  flex: 1;
  text-align: center;
  padding: 10px;
  background: var(--primary-bg);
  border-radius: var(--radius-sm);
}
.stat-num {
  display: block;
  font-size: 22px;
  font-weight: 700;
  color: var(--primary-dark);
}
.stat-label {
  font-size: 11px;
  color: var(--text-secondary);
}

/* ===== 主内容区 ===== */
.main-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  padding-bottom: calc(80px + var(--safe-bottom));
}

/* ===== 通用组件 ===== */
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-hint);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 20px 4px 10px;
}
.section-title:first-child { margin-top: 0; }

.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 12px;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-hint);
}
.empty-state svg { width: 64px; height: 64px; margin: 0 auto 16px; opacity: 0.4; }
.empty-state p { font-size: 14px; }

/* ===== 浮动按钮 ===== */
.fab {
  position: fixed;
  right: 20px;
  bottom: calc(24px + var(--safe-bottom));
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 16px rgba(124,152,133,0.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 50;
  transition: transform 0.2s;
}
.fab:active { transform: scale(0.92); }

/* ===== 模态弹窗 ===== */
.modal-container {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-container.active { display: flex; }
.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
  opacity: 0;
  transition: opacity 0.3s;
}
.modal-container.active .modal-overlay { opacity: 1; }
.modal {
  position: relative;
  background: var(--card-bg);
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  border-radius: 20px 20px 0 0;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  padding-bottom: var(--safe-bottom);
}
.modal-container.active .modal { transform: translateY(0); }
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-title { font-size: 17px; font-weight: 600; }
.modal-close {
  width: 32px; height: 32px;
  border-radius: 50%;
  font-size: 22px;
  color: var(--text-hint);
  display: flex; align-items: center; justify-content: center;
}
.modal-close:active { background: var(--primary-bg); }
.modal-body {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}
.modal-footer {
  display: flex;
  gap: 12px;
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.btn {
  flex: 1;
  padding: 12px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  text-align: center;
  transition: opacity 0.2s;
}
.btn:active { opacity: 0.7; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-secondary { background: var(--primary-bg); color: var(--text-secondary); }
.btn-danger { background: var(--danger); color: #fff; }

/* ===== 表单 ===== */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.form-input, .form-textarea, .form-select {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  font-size: 15px;
  background: var(--bg);
  color: var(--text);
  transition: border-color 0.2s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none;
  border-color: var(--primary);
}
.form-textarea { resize: none; min-height: 80px; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }

/* 图片上传 */
.image-upload-area {
  border: 2px dashed var(--border);
  border-radius: var(--radius-sm);
  padding: 20px;
  text-align: center;
  color: var(--text-hint);
  font-size: 14px;
  transition: all 0.2s;
  cursor: pointer;
}
.image-upload-area:active { border-color: var(--primary); background: var(--primary-bg); }
.image-upload-area.has-image { padding: 0; border-style: solid; }
.image-preview-wrap {
  position: relative;
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.image-preview-wrap img {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
}
.image-remove-btn {
  position: absolute;
  top: 8px; right: 8px;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}

/* 标签输入 */
.tag-input-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  min-height: 46px;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--primary-bg);
  color: var(--primary-dark);
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 13px;
}
.tag-remove { font-size: 16px; line-height: 1; }
.tag-input {
  border: none;
  background: none;
  outline: none;
  flex: 1;
  min-width: 80px;
  font-size: 14px;
}

/* ===== 首页 ===== */
.home-hero {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  border-radius: var(--radius);
  padding: 32px 24px;
  color: #fff;
  text-align: center;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.home-hero::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 120px; height: 120px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.home-hero::after {
  content: '';
  position: absolute;
  bottom: -30px; left: -20px;
  width: 80px; height: 80px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}
.home-date {
  font-size: 48px;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 8px;
  position: relative;
  z-index: 1;
}
.home-month {
  font-size: 15px;
  opacity: 0.9;
  margin-bottom: 16px;
  position: relative;
  z-index: 1;
}
.home-weekday {
  font-size: 20px;
  font-weight: 600;
  position: relative;
  z-index: 1;
}
.home-weekday-en {
  font-size: 12px;
  opacity: 0.7;
  margin-top: 4px;
  position: relative;
  z-index: 1;
  letter-spacing: 2px;
}

.home-tomorrow {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.home-tomorrow-label { font-size: 13px; color: var(--text-secondary); }
.home-tomorrow-value { font-size: 18px; font-weight: 700; color: var(--primary-dark); }

.overview-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.overview-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  text-decoration: none;
  color: inherit;
  display: block;
  transition: transform 0.15s;
}
.overview-card:active { transform: scale(0.97); }
.overview-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
}
.overview-icon svg { width: 22px; height: 22px; }
.overview-count { font-size: 24px; font-weight: 700; margin-bottom: 2px; }
.overview-label { font-size: 12px; color: var(--text-secondary); }

/* ===== 每日计划 ===== */
.plan-item {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  display: flex;
  gap: 12px;
  align-items: flex-start;
  transition: opacity 0.2s;
}
.plan-check {
  width: 24px; height: 24px;
  border: 2px solid var(--border);
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.plan-check.done {
  background: var(--success);
  border-color: var(--success);
}
.plan-check.done svg { display: block; }
.plan-check svg { display: none; width: 14px; height: 14px; color: #fff; }
.plan-content { flex: 1; min-width: 0; }
.plan-title {
  font-size: 15px;
  font-weight: 500;
  word-break: break-word;
}
.plan-item.done .plan-title {
  text-decoration: line-through;
  color: var(--text-hint);
}
.plan-meta {
  display: flex;
  gap: 12px;
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-hint);
  flex-wrap: wrap;
}
.plan-meta-item { display: flex; align-items: center; gap: 3px; }
.plan-thumb {
  width: 50px; height: 50px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  flex-shrink: 0;
  margin-top: 6px;
}
.plan-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.plan-action-btn {
  width: 32px; height: 32px;
  color: var(--text-hint);
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
}
.plan-action-btn:active { background: var(--primary-bg); }

/* ===== 穿搭日记 ===== */
.outfit-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  margin-bottom: 12px;
}
.outfit-img {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  background: var(--primary-bg);
}
.outfit-info { padding: 14px 16px; }
.outfit-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
.outfit-tag {
  font-size: 12px;
  background: var(--primary-bg);
  color: var(--primary-dark);
  padding: 3px 10px;
  border-radius: 10px;
}
.outfit-note { font-size: 14px; color: var(--text-secondary); }
.outfit-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.outfit-time { font-size: 12px; color: var(--text-hint); }

/* ===== 三餐日记 ===== */
.meal-section { margin-bottom: 20px; }
.meal-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  padding: 0 4px;
}
.meal-icon {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.meal-title { font-size: 16px; font-weight: 600; }
.meal-cal-total {
  margin-left: auto;
  font-size: 13px;
  color: var(--text-hint);
}
.meal-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  display: flex;
  gap: 12px;
}
.meal-thumb {
  width: 80px; height: 80px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  flex-shrink: 0;
  background: var(--primary-bg);
}
.meal-detail { flex: 1; min-width: 0; }
.meal-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.meal-info-row {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 2px;
}
.meal-feel { font-size: 13px; color: var(--text-secondary); margin-top: 6px; font-style: italic; }

/* ===== 饮��日记 ===== */
.drink-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.drink-thumb {
  width: 64px; height: 64px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--primary-bg);
}
.drink-info { flex: 1; min-width: 0; }
.drink-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.drink-meta {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text-secondary);
}
.drink-meta-item {
  display: flex;
  align-items: center;
  gap: 2px;
}
.drink-total-card {
  background: linear-gradient(135deg, #E8A87C 0%, #D4845C 100%);
  color: #fff;
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.drink-total-label { font-size: 13px; opacity: 0.9; }
.drink-total-value { font-size: 28px; font-weight: 700; }
.drink-total-unit { font-size: 13px; opacity: 0.9; }

/* ===== 运动日记 ===== */
.health-sync-card {
  background: linear-gradient(135deg, #2D3436 0%, #1a1a1a 100%);
  color: #fff;
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.health-sync-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.health-sync-title { font-size: 15px; font-weight: 600; }
.health-sync-status {
  margin-left: auto;
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 10px;
  background: rgba(255,255,255,0.15);
}

  <script>/**
 * 存储模块
 * - 普通数据使用 localStorage
 * - 图片数据使用 IndexedDB（Base64 存储在 localStorage 会爆容量）
 */
const Storage = (function() {

  const DB_NAME = 'tomorrow-app-db';
  const DB_VERSION = 1;
  const STORE_IMAGES = 'images';
  const STORE_DATA = 'appData';
  let db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = () => reject(req.error);
      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onupgradeneeded = (e) => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains(STORE_IMAGES)) {
          database.createObjectStore(STORE_IMAGES, { keyPath: 'id' });
        }
        if (!database.objectStoreNames.contains(STORE_DATA)) {
          database.createObjectStore(STORE_DATA, { keyPath: 'key' });
        }
      };
    });
  }

  // ===== 图片存储 =====
  async function saveImage(id, blob) {
    if (!db) await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_IMAGES], 'readwrite');
      const store = tx.objectStore(STORE_IMAGES);
      const record = { id, blob, createdAt: Date.now() };
      const req = store.put(record);
      req.onsuccess = () => resolve(id);
      req.onerror = () => reject(req.error);
    });
  }

  async function getImage(id) {
    if (!db) await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_IMAGES], 'readonly');
      const store = tx.objectStore(STORE_IMAGES);
      const req = store.get(id);
      req.onsuccess = () => resolve(req.result ? req.result.blob : null);
      req.onerror = () => reject(req.error);
    });
  }

  async function deleteImage(id) {
    if (!db) await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_IMAGES], 'readwrite');
      const store = tx.objectStore(STORE_IMAGES);
      const req = store.delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  // 把 File/Blob 转为可存储的 Blob，返回 imageId
  async function storeImageFile(file) {
    const id = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
    // 压缩图片
    const compressedBlob = await compressImage(file);
    await saveImage(id, compressedBlob);
    return id;
  }

  // 获取图片 ObjectURL
  async function getImageURL(id) {
    if (!id) return null;
    const blob = await getImage(id);
    return blob ? URL.createObjectURL(blob) : null;
  }

  // 图片压缩
  function compressImage(file, maxSize = 1280, quality = 0.8) {
    return new Promise((resolve) => {
      if (!file.type.startsWith('image/')) {
        resolve(file);
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxSize || height > maxSize) {
            if (width > height) {
              height = (height / width) * maxSize;
              width = maxSize;
            } else {
              width = (width / height) * maxSize;
              height = maxSize;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => {
            resolve(blob || file);
          }, 'image/jpeg', quality);
        };
        img.onerror = () => resolve(file);
        img.src = e.target.result;
      };
      reader.onerror = () => resolve(file);
      reader.readAsDataURL(file);
    });
  }

  // ===== 数据存储（JSON 结构） =====
  function getData(key, defaultVal = null) {
    try {
      const val = localStorage.getItem('tmr_' + key);
      return val ? JSON.parse(val) : defaultVal;
    } catch (e) {
      return defaultVal;
    }
  }

  function setData(key, value) {
    try {
      localStorage.setItem('tmr_' + key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error('存储失败:', e);
      return false;
    }
  }

  function deleteData(key) {
    localStorage.removeItem('tmr_' + key);
  }

  // ===== 按模块/日期管理记录 =====
  // 数据结构: { "2026-07-27": { plan: [...], outfit: [...], meal: {...}, drink: [...], sport: [...] } }

  function getAllRecords() {
    return getData('records', {});
  }

  function getDayRecords(date) {
    const all = getAllRecords();
    return all[date] || { plan: [], outfit: [], meal: { breakfast: [], lunch: [], dinner: [] }, drink: [], sport: [] };
  }

  function saveDayRecords(date, data) {
    const all = getAllRecords();
    all[date] = data;
    setData('records', all);
  }

  function getModuleRecords(date, module) {
    const day = getDayRecords(date);
    if (module === 'meal') return day.meal || { breakfast: [], lunch: [], dinner: [] };
    return day[module] || [];
  }

  function saveModuleRecords(date, module, records) {
    const day = getDayRecords(date);
    day[module] = records;
    saveDayRecords(date, day);
  }

  function addRecord(date, module, record) {
    let records = getModuleRecords(date, module);
    if (module === 'meal') return; // 三餐单独处理
    records.push(record);
    saveModuleRecords(date, module, records);
  }

  function updateRecord(date, module, index, record) {
    let records = getModuleRecords(date, module);
    if (module === 'meal') return;
    records[index] = record;
    saveModuleRecords(date, module, records);
  }

  function deleteRecord(date, module, index) {
    let records = getModuleRecords(date, module);
    if (module === 'meal') return;
    // 删除关联图片
    if (records[index] && records[index].imageId) {
      deleteImage(records[index].imageId);
    }
    records.splice(index, 1);
    saveModuleRecords(date, module, records);
  }

  // 三餐专用
  function getMealRecords(date, mealType) {
    const day = getDayRecords(date);
    const meals = day.meal || { breakfast: [], lunch: [], dinner: [] };
    return meals[mealType] || [];
  }

  function saveMealRecords(date, mealType, records) {
    const day = getDayRecords(date);
    if (!day.meal) day.meal = { breakfast: [], lunch: [], dinner: [] };
    day.meal[mealType] = records;
    saveDayRecords(date, day);
  }

  // 获取所有有记录的日期
  function getAllDates() {
    const all = getAllRecords();
    return Object.keys(all).sort().reverse();
  }

  // 获取某日期的记录总数
  function getDayRecordCount(date) {
    const day = getDayRecords(date);
    let count = 0;
    count += (day.plan || []).length;
    count += (day.outfit || []).length;
    count += (day.meal?.breakfast || []).length;
    count += (day.meal?.lunch || []).length;
    count += (day.meal?.dinner || []).length;
    count += (day.drink || []).length;
    count += (day.sport || []).length;
    return count;
  }

  // 计算连续记录天数
  function getStreakDays() {
    const dates = getAllDates();
    if (dates.length === 0) return 0;
    let streak = 0;
    let checkDate = new Date();
    for (let i = 0; i < 365; i++) {
      const dateStr = formatDate(checkDate);
      if (dates.includes(dateStr)) {
        streak++;
      } else if (i > 0) {
        break;
      }
      checkDate.setDate(checkDate.getDate() - 1);
    }
    return streak;
  }

  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  return {
    openDB,
    storeImageFile,
    getImageURL,
    getImage,
    deleteImage,
    getData,
    setData,
    deleteData,
    getAllRecords,
    getDayRecords,
    saveDayRecords,
    getModuleRecords,
    saveModuleRecords,
    addRecord,
    updateRecord,
    deleteRecord,
    getMealRecords,
    saveMealRecords,
    getAllDates,
    getDayRecordCount,
    getStreakDays,
    formatDate
  };
})();

/**
 * UI 通用工具层
 */
const UI = (function() {

  const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  const weekdaysEn = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
  const months = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];

  function getWeekday(date) {
    return weekdays[new Date(date).getDay()];
  }

  function getWeekdayEn(date) {
    return weekdaysEn[new Date(date).getDay()];
  }

  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function formatDateDisplay(dateStr) {
    const d = new Date(dateStr);
    return `${d.getMonth() + 1}月${d.getDate()}日`;
  }

  function formatDateFull(dateStr) {
    const d = new Date(dateStr);
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  }

  // Toast 提示
  function toast(msg, duration = 2000) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('show'), duration);
  }

  // 模态弹窗
  function showModal(title, bodyHTML, options = {}) {
    const container = document.getElementById('modalContainer');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';

    const modal = document.createElement('div');
    modal.className = 'modal';

    let footerHTML = '';
    if (options.showFooter !== false) {
      footerHTML = `
        <div class="modal-footer">
          ${options.cancelText ? `<button class="btn btn-secondary" data-action="cancel">${options.cancelText}</button>` : ''}
          <button class="btn btn-primary" data-action="confirm">${options.confirmText || '保存'}</button>
        </div>
      `;
    }

    modal.innerHTML = `
      <div class="modal-header">
        <div class="modal-title">${title}</div>
        <button class="modal-close" data-action="close">×</button>
      </div>
      <div class="modal-body">${bodyHTML}</div>
      ${footerHTML}
    `;

    container.innerHTML = '';
    container.appendChild(overlay);
    container.appendChild(modal);
    container.classList.add('active');

    const close = () => {
      container.classList.remove('active');
      setTimeout(() => container.innerHTML = '', 300);
    };

    modal.addEventListener('click', (e) => {
      const action = e.target.dataset.action;
      if (action === 'close' || action === 'cancel') {
        if (options.onCancel) options.onCancel();
        close();
      } else if (action === 'confirm') {
        if (options.onConfirm) {
          const result = options.onConfirm(modal);
          if (result !== false) close();
        } else {
          close();
        }
      }
    });
    overlay.addEventListener('click', close);

    return { modal, close };
  }

  function closeModal() {
    const container = document.getElementById('modalContainer');
    container.classList.remove('active');
    setTimeout(() => container.innerHTML = '', 300);
  }

  // 图片查看器
  function showImage(url) {
    const viewer = document.getElementById('imageViewer');
    const img = document.getElementById('viewerImg');
    img.src = url;
    viewer.classList.add('active');
  }

  function hideImage() {
    document.getElementById('imageViewer').classList.remove('active');
  }

  // 确认对话框
  function confirm(message, onConfirm) {
    showModal('提示', `<p style="text-align:center;padding:20px 0;font-size:15px;">${message}</p>`, {
      showFooter: true,
      confirmText: '确定',
      cancelText: '取消',
      onConfirm: () => { onConfirm(); }
    });
  }

  // 图片选择器（调用系统图库）
  function pickImage(callback) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.style.display = 'none';
    document.body.appendChild(input);

    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      document.body.removeChild(input);
      if (file) {
        callback(file);
      }
    });
    input.click();
  }

  // 创建图片预览区域
  function createImageUploadArea(currentImageId, onImageChange) {
    const wrap = document.createElement('div');
    wrap.className = 'image-upload-area';
    wrap.innerHTML = `
      <svg viewBox="0 0 24 24" width="32" height="32" style="margin:0 auto 8px;display:block;opacity:0.4;">
        <path fill="currentColor" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
      </svg>
      <div>点击上传图片</div>
    `;

    if (currentImageId) {
      loadImagePreview(wrap, currentImageId, onImageChange);
    }

    wrap.addEventListener('click', () => {
      pickImage(async (file) => {
        const imageId = await Storage.storeImageFile(file);
        onImageChange(imageId);
        loadImagePreview(wrap, imageId, onImageChange);
      });
    });

    return wrap;
  }

  async function loadImagePreview(wrap, imageId, onImageChange) {
    const url = await Storage.getImageURL(imageId);
    if (url) {
      wrap.classList.add('has-image');
      wrap.innerHTML = `
        <div class="image-preview-wrap">
          <img src="${url}" alt="预览">
          <button class="image-remove-btn" type="button">×</button>
        </div>
      `;
      wrap.querySelector('.image-remove-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        Storage.deleteImage(imageId);
        onImageChange(null);
        wrap.classList.remove('has-image');
        wrap.innerHTML = `
          <svg viewBox="0 0 24 24" width="32" height="32" style="margin:0 auto 8px;display:block;opacity:0.4;">
            <path fill="currentColor" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
          </svg>
          <div>点击上传图片</div>
        `;
      });
    }
  }

  // 创建标签输入器
  function createTagInput(tags = [], onChange) {
    const wrap = document.createElement('div');
    wrap.className = 'tag-input-wrap';

    function render() {
      wrap.innerHTML = '';
      tags.forEach((tag, i) => {
        const el = document.createElement('span');
        el.className = 'tag';
        el.innerHTML = `${tag}<span class="tag-remove" data-idx="${i}">×</span>`;
        wrap.appendChild(el);
      });
      const input = document.createElement('input');
      input.className = 'tag-input';
      input.placeholder = '输入后回车添加';
      input.type = 'text';
      wrap.appendChild(input);

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && input.value.trim()) {
          e.preventDefault();
          tags.push(input.value.trim());
          input.value = '';
          render();
          if (onChange) onChange(tags);
        } else if (e.key === 'Backspace' && !input.value && tags.length > 0) {
          tags.pop();
          render();
          if (onChange) onChange(tags);
        }
      });

      wrap.querySelectorAll('.tag-remove').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(e.target.dataset.idx);
          tags.splice(idx, 1);
          render();
          if (onChange) onChange(tags);
        });
      });
    }
    render();
    return wrap;
  }

  // 空状态
  function emptyState(text) {
    return `
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <p>${text}</p>
      </div>
    `;
  }

  return {
    weekdays,
    weekdaysEn,
    months,
    getWeekday,
    getWeekdayEn,
    formatDate,
    formatDateDisplay,
    formatDateFull,
    toast,
    showModal,
    closeModal,
    showImage,
    hideImage,
    confirm,
    pickImage,
    createImageUploadArea,
    createTagInput,
    emptyState
  };
})();

          <div class="plan-meta">
            ${r.reminder ? `<span class="plan-meta-item">⏰ ${r.reminder}</span>` : ''}
            ${r.note ? `<span class="plan-meta-item">📝 ${escapeHtml(r.note)}</span>` : ''}
          </div>

        <div class="plan-actions">

          </button>
          <button class="plan-action-btn" data-action="delete" data-idx="${i}">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          </button>
        </div>
      `;
      container.appendChild(div);

      // 缩略图点击
      const thumb = div.querySelector('.plan-thumb');
      if (thumb) {
        thumb.addEventListener('click', () => UI.showImage(thumb.src));
      }
    }

    // 绑定事件
    container.querySelectorAll('.plan-check').forEach(check => {
      check.addEventListener('click', () => {
        const idx = parseInt(check.dataset.idx);
        toggleDone(idx);
      });
    });
    container.querySelectorAll('[data-action="edit"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        showAddModal(idx);
      });
    });
    container.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        UI.confirm('确定删除这条计划吗？', () => {
          Storage.deleteRecord(currentDate, 'plan', idx);
          render(currentDate);
          UI.toast('已删除');
        });
      });
    });
  }

  function toggleDone(idx) {
    const records = Storage.getModuleRecords(currentDate, 'plan');
    records[idx].done = !records[idx].done;
    Storage.saveModuleRecords(currentDate, 'plan', records);
    render(currentDate);
  }

  function showAddModal(editIdx) {
    const records = Storage.getModuleRecords(currentDate, 'plan');
    const editing = editIdx !== undefined ? records[editIdx] : null;
    let currentImageId = editing?.imageId || null;
    let currentTags = editing?.tags ? [...editing.tags] : [];

    const bodyHTML = `
      <div class="form-group">
        <label class="form-label">计划内容</label>
        <input type="text" class="form-input" id="planTitle" placeholder="今天要做什么？" value="${editing ? escapeHtml(editing.title) : ''}">
      </div>
      <div class="form-group">
        <label class="form-label">提醒时间</label>
        <input type="time" class="form-input" id="planReminder" value="${editing?.reminder || ''}">
      </div>
      <div class="form-group">
        <label class="form-label">备注</label>
        <textarea class="form-textarea" id="planNote" placeholder="补充说明...">${editing?.note ? escapeHtml(editing.note) : ''}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">配图</label>
        <div id="imageUploadArea"></div>
      </div>
    `;

    const { modal } = UI.showModal(editIdx !== undefined ? '编辑计划' : '添加计划', bodyHTML, {
      confirmText: editIdx !== undefined ? '更新' : '添加',
      cancelText: '取消',
      onConfirm: () => {
        const title = modal.querySelector('#planTitle').value.trim();
        if (!title) {
          UI.toast('请输入计划内容');
          return false;
        }
        const reminder = modal.querySelector('#planReminder').value;
        const note = modal.querySelector('#planNote').value.trim();

        const record = { title, reminder, note, imageId: currentImageId, done: editing?.done || false };
        if (editIdx !== undefined) {
          Storage.updateRecord(currentDate, 'plan', editIdx, record);
          UI.toast('已更新');
        } else {
          Storage.addRecord(currentDate, 'plan', record);
          UI.toast('已添加');
        }
        render(currentDate);

        // 设置提醒
        if (reminder) {
          scheduleReminder(title, reminder);
        }
      }
    });

    // 图片上传
    const uploadArea = modal.querySelector('#imageUploadArea');
    const uploadWidget = UI.createImageUploadArea(currentImageId, (newId) => {
      currentImageId = newId;
    });
    uploadArea.appendChild(uploadWidget);
  }

  function scheduleReminder(title, time) {
    // 使用 Notification API（需用户授权）
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') {
      _createNotification(title, time);
    } else if (Notification.permission !== 'denied') {
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          _createNotification(title, time);
        }
      });
    }
  }

  function _createNotification(title, time) {
    const now = new Date();
    const [h, m] = time.split(':').map(Number);
    const target = new Date(now);
    target.setHours(h, m, 0, 0);
    if (target <= now) return; // 已过时间不提醒

    const delay = target.getTime() - now.getTime();
    setTimeout(() => {
      try {
        new Notification('明天星期几', {
          body: title,
          icon: 'assets/icons/icon-192.png',
          tag: 'plan_' + Date.now()
        });
      } catch (e) {
        console.warn('通知创建失败', e);
      }
    }, delay);
    UI.toast(`已设置 ${time} 提醒`);
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  return { render };
})();

/**
 * 运动日记模块
 * 支持手动记录 + URL Scheme 接收健康数据（配合 iOS 快捷指令自动同步）
 */
const SportModule = (function() {

  let currentDate = null;
  let healthData = null;
  let healthConnected = false;

  const sportTypes = [
    { name: '步行', icon: '🚶' },
    { name: '跑步', icon: '🏃' },
    { name: '骑行', icon: '🚴' },
    { name: '游泳', icon: '🏊' },
    { name: '瑜伽', icon: '🧘' },
    { name: '力量训练', icon: '💪' },
    { name: '球类运动', icon: '⚽' },
    { name: '其他', icon: '🏅' }
  ];

  // 监听 URL Scheme 回调，接收来自快捷指令的健康数据
  window.addEventListener('load', () => {
    const params = new URLSearchParams(window.location.hash.substring(1));
    if (params.get('action') === 'healthSync') {
      const steps = parseInt(params.get('steps')) || 0;
      const duration = parseInt(params.get('duration')) || 0;
      const calories = parseInt(params.get('calories')) || 0;
      const types = (params.get('types') || '').split(',').filter(Boolean);
      const date = params.get('date') || Storage.formatDate(new Date());

      if (steps || duration || calories) {
        healthData = { steps, duration, calories, sportTypes: types, syncedAt: Date.now() };
        healthConnected = true;
        Storage.setData('healthConnected', true);
        Storage.setData('healthData_' + date, healthData);
        UI.toast('✅ 健康数据已自动同步');

        // 清理 URL hash
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, '', window.location.pathname);
        }
      }
    }
  });

  function render(date) {
    currentDate = date;
    const main = document.getElementById('mainContent');
    const records = Storage.getModuleRecords(date, 'sport');

    main.innerHTML = `
      <div class="fade-in">

            <div class="health-sync-title">健康数据</div>

            <div class="health-metric">
              <div class="health-metric-label">运动时长</div>
              <div class="health-metric-value">${totalDuration}<span class="health-metric-unit">分钟</span></div>

            <div class="health-metric">
              <div class="health-metric-label">消耗卡路里</div>
              <div class="health-metric-value">${totalCalories}<span class="health-metric-unit">kcal</span></div>
            </div>
            <div class="health-metric">
              <div class="health-metric-label">运动类型</div>
              <div class="health-metric-value" style="font-size:16px;">${getSportTypesSummary()}</div>
            </div>
          </div>
          <button class="health-sync-btn" id="healthSyncBtn">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
            ${healthConnected ? '同步今日数据' : '连接苹果健康'}
          </button>
        </div>

        <div class="section-title">运动记录</div>
        <div id="sportList"></div>
      </div>
    `;

    renderList(records);
    document.getElementById('fab').style.display = 'flex';
    document.getElementById('fab').onclick = () => showAddModal();

    document.getElementById('healthSyncBtn').addEventListener('click', syncHealthData);
  }

  function getSportTypesSummary() {
    const records = Storage.getModuleRecords(currentDate, 'sport');
    const types = new Set();
    if (healthData?.sportTypes) healthData.sportTypes.forEach(t => types.add(t));
    records.forEach(r => { if (r.type) types.add(r.type); });
    if (types.size === 0) return '暂无';
    return Array.from(types).slice(0, 2).join('、') + (types.size > 2 ? '等' : '');
  }

  async function syncHealthData() {
    const btn = document.getElementById('healthSyncBtn');
    const statusEl = document.getElementById('healthStatus');

    btn.innerHTML = '<span style="display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;"></span> 同步中...';
    btn.disabled = true;

    try {
      // 尝试通过 Web API 访问健康数据
      // 注意：浏览器环境无法直接访问 Apple HealthKit
      // 这里通过多种策略尝试获取数据
      const data = await fetchHealthData();

      if (data) {
        healthData = data;
        healthConnected = true;
        Storage.setData('healthConnected', true);
        Storage.setData('healthData_' + currentDate, data);
        statusEl.textContent = '已连接';
        statusEl.classList.add('connected');
        UI.toast('健康数据同步成功');
        render(currentDate);
      } else {
        throw new Error('无法获取健康数据');
      }
    } catch (err) {
      console.warn('健康数据同步失败:', err);
      // 提供手动输入入口
      showHealthManualInput();
    } finally {
      btn.disabled = false;
    }
  }

  async function fetchHealthData() {
    // 策略1：尝试通过 HealthKit Web Bridge（iOS Safari + 快捷指令桥接）
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.healthKit) {
      return new Promise((resolve) => {
        window.webkit.messageHandlers.healthKit.postMessage({
          date: currentDate,
          metrics: ['steps', 'duration', 'calories', 'sportTypes']
        });
        window._healthKitCallback = (data) => resolve(data);
        setTimeout(() => resolve(null), 5000);
      });
    }

    // 策略2：尝试通过 Generic Sensor API（部分设备支持计步器）
    if ('Accelerometer' in window && 'Gyroscope' in window) {
      try {
        // 注：此处为占位逻辑，实际步数需要持续累积
        return null;
      } catch (e) {
        // 忽略
      }
    }

    // 策略3：PWA 环境下无法直接访问 HealthKit
    return null;
  }

    const appUrl = window.location.origin + window.location.pathname;

    const bodyHTML = `
      <div style="background:linear-gradient(135deg,#E8F5E9,#C8E6C9);padding:16px;border-radius:12px;margin-bottom:16px;">
        <div style="font-weight:600;font-size:15px;margin-bottom:8px;">📲 两种同步方式</div>
        <div style="font-size:13px;color:var(--text-secondary);line-height:1.6;">
          <strong>方式一：自动同步（推荐）</strong><br>
          打开 iOS「快捷指令」App → 新建自动化 → 添加"查找健康样本"操作 → 添加"打开URL"操作 → 粘贴下方URL模板<br><br>
          <strong>方式二：手动输入</strong><br>
          直接在下方填写今日数据
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">📋 快捷指令 URL 模板（复制到快捷指令中）</label>
        <textarea class="form-textarea" readonly style="font-size:11px;font-family:monospace;height:60px;background:#f5f5f5;" id="shortcutUrl">${shortcutUrl}</textarea>
        <button class="btn btn-secondary" style="margin-top:6px;width:100%;padding:8px;" id="copyShortcutBtn">📋 复制快捷指令 URL</button>
      </div>

      <hr style="border:none;border-top:1px solid var(--border);margin:16px 0;">

      <div class="form-group">
        <label class="form-label">步数</label>
        <input type="number" class="form-input" id="manualSteps" placeholder="如：8000" value="${healthData?.steps || ''}">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">运动时长 (分钟)</label>
          <input type="number" class="form-input" id="manualDuration" placeholder="如：30" value="${healthData?.duration || ''}">
        </div>
        <div class="form-group">
          <label class="form-label">消耗卡路里</label>
          <input type="number" class="form-input" id="manualCalories" placeholder="如：200" value="${healthData?.calories || ''}">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">运动类型（逗号分隔）</label>
        <input type="text" class="form-input" id="manualTypes" placeholder="如：步行,跑步" value="${healthData?.sportTypes ? healthData.sportTypes.join(',') : ''}">
      </div>
    `;

    UI.confirm(
      '选择健康数据同步方式',
      () => {
        UI.closeModal();
        setTimeout(() => {
          const { modal } = UI.showModal('同步健康数据', bodyHTML, {
            confirmText: '保存数据',
            cancelText: '取消',
            onConfirm: () => {
              const steps = parseInt(modal.querySelector('#manualSteps').value) || 0;
              const duration = parseInt(modal.querySelector('#manualDuration').value) || 0;
              const calories = parseInt(modal.querySelector('#manualCalories').value) || 0;
              const types = modal.querySelector('#manualTypes').value.split(',').map(t => t.trim()).filter(Boolean);

              healthData = { steps, duration, calories, sportTypes: types, syncedAt: Date.now() };
              healthConnected = true;
              Storage.setData('healthConnected', true);
              Storage.setData('healthData_' + currentDate, healthData);
              UI.toast('健康数据已保存');
              render(currentDate);
            }
          });

          // 复制按钮
          modal.querySelector('#copyShortcutBtn').addEventListener('click', () => {
            const url = modal.querySelector('#shortcutUrl').value;
            navigator.clipboard.writeText(url).then(() => {
              UI.toast('URL 已复制！粘贴到快捷指令中');
            }).catch(() => {
              UI.toast('请手动复制上方URL');
            });
          });

  async function renderList(records) {
    const container = document.getElementById('sportList');
    if (records.length === 0) {
      container.innerHTML = UI.emptyState('点击右下角 + 记录运动');
      return;
    }

    container.innerHTML = '';
    for (let i = 0; i < records.length; i++) {
      const r = records[i];
      const div = document.createElement('div');
      div.className = 'sport-card';
      const typeInfo = sportTypes.find(t => t.name === r.type) || sportTypes[sportTypes.length - 1];

      let imgHTML = '';
      if (r.imageId) {
        const url = await Storage.getImageURL(r.imageId);
        if (url) {
          imgHTML = `<img class="sport-thumb" src="${url}" alt="">`;
        }
      }

      div.innerHTML = `
        ${imgHTML}
        <div class="sport-header">
          <span style="font-size:24px;">${typeInfo.icon}</span>
          <span class="sport-type-badge">${escapeHtml(r.type || '运动')}</span>
          <span class="sport-time">${r.time || ''}</span>
        </div>
        <div class="sport-metrics">
          ${r.steps ? `<div class="sport-metric"><div class="sport-metric-num">${r.steps}</div><div class="sport-metric-label">步数</div></div>` : ''}
          ${r.duration ? `<div class="sport-metric"><div class="sport-metric-num">${r.duration}</div><div class="sport-metric-label">分钟</div></div>` : ''}
          ${r.calories ? `<div class="sport-metric"><div class="sport-metric-num">${r.calories}</div><div class="sport-metric-label">千卡</div></div>` : ''}
          ${r.distance ? `<div class="sport-metric"><div class="sport-metric-num">${r.distance}</div><div class="sport-metric-label">公里</div></div>` : ''}
        </div>
        ${r.note ? `<div class="sport-note">${escapeHtml(r.note)}</div>` : ''}
        <div style="display:flex;gap:4px;margin-top:10px;justify-content:flex-end;">
          <button class="plan-action-btn" data-action="edit" data-idx="${i}">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          </button>
          <button class="plan-action-btn" data-action="delete" data-idx="${i}">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          </button>
        </div>
      `;
      container.appendChild(div);

      const img = div.querySelector('.sport-thumb');
      if (img) {
        img.addEventListener('click', () => UI.showImage(img.src));
      }
    }

    container.querySelectorAll('[data-action="edit"]').forEach(btn => {
      btn.addEventListener('click', () => showAddModal(parseInt(btn.dataset.idx)));
    });
    container.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        UI.confirm('确定删除这条运动记录吗？', () => {
          Storage.deleteRecord(currentDate, 'sport', idx);
          render(currentDate);
          UI.toast('已删除');
        });
      });
    });
  }

  function showAddModal(editIdx) {
    const records = Storage.getModuleRecords(currentDate, 'sport');
    const editing = editIdx !== undefined ? records[editIdx] : null;
    let currentImageId = editing?.imageId || null;

    const bodyHTML = `
      <div class="form-group">
        <label class="form-label">运动场景 / 装备图片</label>
        <div id="imageUploadArea"></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">运动类型</label>
          <select class="form-select" id="sportType">
            ${sportTypes.map(t => `<option value="${t.name}" ${editing?.type === t.name ? 'selected' : ''}>${t.icon} ${t.name}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">运动时间</label>
          <input type="time" class="form-input" id="sportTime" value="${editing?.time || new Date().toTimeString().slice(0, 5)}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">步数</label>
          <input type="number" class="form-input" id="sportSteps" placeholder="0" value="${editing?.steps || ''}">
        </div>
        <div class="form-group">
          <label class="form-label">时长 (分钟)</label>
          <input type="number" class="form-input" id="sportDuration" placeholder="0" value="${editing?.duration || ''}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">消耗卡路里</label>
          <input type="number" class="form-input" id="sportCalories" placeholder="0" value="${editing?.calories || ''}">
        </div>
        <div class="form-group">
          <label class="form-label">距离 (公里)</label>
          <input type="number" step="0.1" class="form-input" id="sportDistance" placeholder="0.0" value="${editing?.distance || ''}">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">备注</label>
        <textarea class="form-textarea" id="sportNote" placeholder="运动感受、路线、天气等...">${editing?.note ? escapeHtml(editing.note) : ''}</textarea>
      </div>
    `;

    const { modal } = UI.showModal(editIdx !== undefined ? '编辑运动' : '记录运动', bodyHTML, {
      confirmText: editIdx !== undefined ? '更新' : '保存',
      cancelText: '取消',
      onConfirm: () => {
        const type = modal.querySelector('#sportType').value;
        const time = modal.querySelector('#sportTime').value;
        const steps = modal.querySelector('#sportSteps').value;
        const duration = modal.querySelector('#sportDuration').value;
        const calories = modal.querySelector('#sportCalories').value;
        const distance = modal.querySelector('#sportDistance').value;
        const note = modal.querySelector('#sportNote').value.trim();

        if (!type && !duration && !calories && !currentImageId) {
          UI.toast('请至少填写一项内容');
          return false;
        }

        const record = { type, time, steps, duration, calories, distance, note, imageId: currentImageId };
        if (editIdx !== undefined) {
          Storage.updateRecord(currentDate, 'sport', editIdx, record);
          UI.toast('已更新');
        } else {
          Storage.addRecord(currentDate, 'sport', record);
          UI.toast('已保存');
        }
        render(currentDate);
      }
    });

    modal.querySelector('#imageUploadArea').appendChild(
      UI.createImageUploadArea(currentImageId, (newId) => { currentImageId = newId; })
    );
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  return { render };
})();

/**
 * 主应用控制器
 */
const App = (function() {

  const modules = {
    home: HomeModule,
    plan: PlanModule,
    outfit: OutfitModule,
    meal: MealModule,
    drink: DrinkModule,
    sport: SportModule
  };

  const moduleTitles = {
    home: '明天星期几',
    plan: '每日计划',
    outfit: '穿搭日记',
    meal: '三餐日记',
    drink: '饮品日记',
    sport: '运动日记'
  };

  let currentModule = 'home';
  let currentDate = UI.formatDate(new Date());

  async function init() {
    // 初始化数据库
    await Storage.openDB();

    // 更新侧边栏日期
    updateSidebarDate();

    // 初始化日期选择器
    const dateSelector = document.getElementById('dateSelector');
    dateSelector.value = currentDate;
    dateSelector.addEventListener('change', (e) => {
      currentDate = e.target.value;
      updateSidebarDate();
      if (currentModule !== 'home') {
        modules[currentModule].render(currentDate);
      } else {
        modules[currentModule].render();
      }
    });

    // 日期切换
    document.getElementById('prevDate').addEventListener('click', () => shiftDate(-1));
    document.getElementById('nextDate').addEventListener('click', () => shiftDate(1));

    // 侧边栏开关
    document.getElementById('menuBtn').addEventListener('click', toggleSidebar);
    document.getElementById('overlay').addEventListener('click', closeSidebar);

    // 导航项点击
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        const module = item.dataset.module;
        switchModule(module);
        closeSidebar();
      });
    });

    // 今天按钮
    document.getElementById('todayBtn').addEventListener('click', () => {
      currentDate = UI.formatDate(new Date());
      dateSelector.value = currentDate;
      updateSidebarDate();
      switchModule('home');
      UI.toast('回到今天');
    });

    // 图片查看器关闭
    document.getElementById('viewerClose').addEventListener('click', UI.hideImage);
    document.getElementById('imageViewer').addEventListener('click', (e) => {
      if (e.target.id === 'imageViewer') UI.hideImage();
    });

    // 更新统计
    updateStats();

    // 渲染默认模块
    modules.home.render();

    // 请求通知权限
    if ('Notification' in window && Notification.permission === 'default') {
      // 不主动弹窗，等用户设置提醒时再请求
    }
  }

  function switchModule(module) {
    if (!modules[module]) return;
    currentModule = module;

    // 更新导航激活状态
    document.querySelectorAll('.nav-item').forEach(item => {
      item.classList.toggle('active', item.dataset.module === module);
    });

    // 更新标题
    document.getElementById('pageTitle').textContent = moduleTitles[module];

    // 隐藏 FAB（首页不需要）
    if (module === 'home') {
      document.getElementById('fab').style.display = 'none';
    }

    // 渲染模块
    if (module === 'home') {
      modules.home.render();
    } else {
      modules[module].render(currentDate);
    }

    updateStats();
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('active');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('active');
  }

  function shiftDate(delta) {
    const d = new Date(currentDate);
    d.setDate(d.getDate() + delta);
    currentDate = UI.formatDate(d);
    document.getElementById('dateSelector').value = currentDate;
    updateSidebarDate();
    if (currentModule !== 'home') {
      modules[currentModule].render(currentDate);
    }
  }

  function setCurrentDate(date) {
    currentDate = date;
    document.getElementById('dateSelector').value = date;
    updateSidebarDate();
  }

  function updateSidebarDate() {
    const el = document.getElementById('sidebarDate');
    const d = new Date(currentDate);
    el.textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 · ${UI.getWeekday(currentDate)}`;
  }

  function updateStats() {
    document.getElementById('totalRecords').textContent =
      Storage.getAllDates().reduce((sum, date) => sum + Storage.getDayRecordCount(date), 0);
    document.getElementById('streakDays').textContent = Storage.getStreakDays();
  }

  return {
    init,
    switchModule,
    setCurrentDate
  };
})();

document.addEventListener('DOMContentLoaded', App.init);

  const b=new Blob(["const CACHE_NAME = 'tomorrow-app-v1';\nconst ASSETS = [\n  './',\n  './index.html',\n  './css/style.css',\n  './js/storage.js',\n  './js/ui.js',\n  './js/app.js',\n  './js/sw-register.js',\n  './js/modules/home.js',\n  './js/modules/plan.js',\n  './js/modules/outfit.js',\n  './js/modules/meal.js',\n  './js/modules/drink.js',\n  './js/modules/sport.js',\n  './manifest.json',\n  './assets/icons/icon-192.png',\n  './assets/icons/icon-512.png'\n];\n\nself.addEventListener('install', (e) => {\n  e.waitUntil(\n    caches.open(CACHE_NAME).then(cache => {\n      return cache.addAll(ASSETS).catch(err => {\n        console.warn('\u90e8\u5206\u8d44\u6e90\u7f13\u5b58\u5931\u8d25:', err);\n      });\n    })\n  );\n  self.skipWaiting();\n});\n\nself.addEventListener('activate', (e) => {\n  e.waitUntil(\n    caches.keys().then(keys => {\n      return Promise.all(\n        keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k))\n      );\n    })\n  );\n  self.clients.claim();\n});\n\nself.addEventListener('fetch', (e) => {\n  // \u53ea\u7f13\u5b58\u540c\u6e90 GET \u8bf7\u6c42\n  if (e.request.method !== 'GET') return;\n\n  e.respondWith(\n    caches.match(e.request).then(cached => {\n      // \u7f51\u7edc\u4f18\u5148\uff0c\u5931\u8d25\u56de\u9000\u7f13\u5b58\uff08\u9002\u7528\u4e8e\u52a8\u6001\u5185\u5bb9\uff09\n      return fetch(e.request).then(response => {\n        // \u7f13\u5b58\u65b0\u8d44\u6e90\n        if (response && response.status === 200 && response.type === 'basic') {\n          const clone = response.clone();\n          caches.open(CACHE_NAME).then(cache => cache.put(e.request, clone));\n        }\n        return response;\n      }).catch(() => {\n        return cached || caches.match('./index.html');\n      });\n    })\n  );\n});\n"],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(b),{scope:'./'}).then(r=>console.log('SW OK')).catch(e=>console.warn('SW:',e));
